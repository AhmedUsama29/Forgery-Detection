<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary fw-bold">📋 University Certificates Record</h2>
    <button class="btn btn-primary" (click)="loadCertificates()">Refresh List</button>
  </div>

  <div class="card shadow border-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0 text-center">
        <thead class="table-dark">
          <tr>
            <th>Student Name</th>
            <th>Faculty</th>
            <th>Graduation Year</th>
            <th>ID</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cert of certificates()">
            <td class="fw-bold">{{ cert.student_name }}</td>
            <td>{{ cert.faculty }}</td>
            <td>{{ cert.graduation_year }}</td>
            <td>
              <small class="font-monospace text-muted">{{ cert.doc_id }}</small>
            </td>
            <td>
              <div class="btn-group">
                <!-- View Button to display PDF -->
                <button class="btn btn-outline-info btn-sm" 
                        (click)="viewCertificate(cert)"
                        [disabled]="isGeneratingPDF()"
                        title="View Certificate">
                  👁️ View
                </button>
                
                <!-- Download Button to save PDF -->
                <button class="btn btn-outline-success btn-sm" 
                        (click)="downloadCertificate(cert)"
                        [disabled]="isGeneratingPDF()"
                        title="Download Certificate">
                  ⬇️ Download
                </button>
                
                <!-- Delete Button to remove certificate -->
                <button class="btn btn-outline-danger btn-sm" 
                        (click)="deleteCert(cert.doc_id)"
                        title="Delete Certificate">
                  🗑️ Delete
                </button>
              </div>
            </td>
           </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Loading/Processing Message -->
  <div *ngIf="isGeneratingPDF()" class="mt-3 alert alert-info text-center">
    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
    Loading certificate...
  </div>

  <!-- Details View (Optional) -->
  <div *ngIf="selectedCert()" class="mt-4 card bg-light border-info">
    <div class="card-body">
      <h5 class="card-title">Full Certificate Details:</h5>
      <pre class="bg-white p-3 border rounded">{{ selectedCert() | json }}</pre>
      <button class="btn btn-secondary btn-sm" (click)="selectedCert.set(null)">
        Close Details
      </button>
    </div>
  </div>
</div>
